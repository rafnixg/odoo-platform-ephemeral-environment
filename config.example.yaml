# Canonical example; its values are mirrored in the configuration bundled with the PyPI app.
database_url: sqlite:///./mini_runbot.db
builds_root: ./builds
odoo_image: odoo:16.0
postgres_image: postgres:15
# Optional per-build image profiles. A build picks one explicitly (odoo_version) or by ref name
# (17.0, 17.0-fix-payment); otherwise the global odoo_image/postgres_image above apply.
# odoo_versions:
#   "16.0": {odoo_image: odoo:16.0, postgres_image: postgres:15}
#   "17.0": {odoo_image: odoo:17.0, postgres_image: postgres:15}
#   "18.0": {odoo_image: odoo:18.0, postgres_image: postgres:16}
#   "19.0": {odoo_image: odoo:19.0, postgres_image: postgres:16}
#   "20.0": {odoo_image: odoo:20.0, postgres_image: postgres:16}
port_start: 18000
port_end: 19999
command_timeout_seconds: 900
health_timeout_seconds: 120
max_concurrent_builds: 2
cleanup_interval_seconds: 60
# Zero retains audit rows and logs indefinitely. Set an explicit period to enable deletion.
destroyed_retention_seconds: 0
# OCA tests commonly depend on Odoo demo XML records. Disable for production-like previews.
load_demo_data: true
retain_failed_runtime: false
repositories:
  custom:
    # HTTPS/SSH remotes are fetched at the requested ref. Local Git paths also work.
    url: https://github.com/OCA/e-commerce.git
    default_ref: "16.0"
    target: custom-addons
    addons_subpath: .
    allow_request_ref: true
    addons_priority: 100
