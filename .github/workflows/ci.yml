name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Lint Python
        run: python -m ruff check .
      - name: Run tests without Docker
        run: python -m pytest -m "not docker"
      - name: Check frontend JavaScript
        run: node --check src/mini_runbot/web/app.js
      - name: Build Python distributions
        run: python -m build
      - name: Verify wheel contents
        run: python scripts/check_distribution.py dist
      - name: Check whitespace errors
        run: git diff --check
