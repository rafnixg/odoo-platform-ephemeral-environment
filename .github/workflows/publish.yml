name: Publish to PyPI

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify tag matches package version
        run: python -c "import os, tomllib; version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME'] == f'v{version}', f'tag must be v{version}'"
      - name: Run non-Docker tests
        run: python -m pytest -m "not docker"
      - name: Lint Python
        run: python -m ruff check .
      - name: Build distributions
        run: python -m build
      - name: Verify wheel contents
        run: python scripts/check_distribution.py dist

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mini-runbot/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install build
      - name: Build distributions
        run: python -m build
      - name: Publish with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
