[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-runbot"
version = "0.2.1"
description = "A small, local build orchestrator proof of concept for Odoo 16"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "rafnixg" }]
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
keywords = ["odoo", "docker", "runbot", "testing", "ephemeral-environments"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi>=0.115,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.9,<3",
  "pyyaml>=6,<7",
  "rich>=13,<15",
  "sqlalchemy>=2.0,<3",
  "typer>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "ruff>=0.8,<1",
]
docs = [
  "mkdocs-material>=9,<10",
]

[project.scripts]
mini-runbot = "mini_runbot.cli.main:app"

[project.urls]
Documentation = "https://rafnixg.github.io/odoo-platform-ephemeral-environment/"
Repository = "https://github.com/rafnixg/odoo-platform-ephemeral-environment"
Issues = "https://github.com/rafnixg/odoo-platform-ephemeral-environment/issues"
Changelog = "https://github.com/rafnixg/odoo-platform-ephemeral-environment/blob/master/CHANGELOG.md"
DeepWiki = "https://deepwiki.com/rafnixg/odoo-platform-ephemeral-environment"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mini_runbot = [
  "resources/*.yaml",
  "templates/*.j2",
  "web/*.html",
  "web/*.css",
  "web/*.js",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_default_fixture_loop_scope = "function"
markers = ["docker: requires an available Docker daemon"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"**/__manifest__.py" = ["B018"]
